# Downstream OTLP receiver used in the demo stack.
# It forwards the already-redacted log records to Grafana Cloud and, for
# local verification, still echoes them to stdout and a file.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

extensions:
  # Grafana Cloud OTLP gateway uses HTTP basic auth:
  #   username = your numeric instance ID
  #   password = a Cloud Access Policy token (scope: logs:write / metrics:write)
  basicauth/grafana_cloud:
    client_auth:
      username: "${env:GRAFANA_CLOUD_INSTANCE_ID}"
      password: "${env:GRAFANA_CLOUD_API_TOKEN}"

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed
  file:
    path: /output/received-logs.json
  otlphttp/grafana_cloud:
    # e.g. https://otlp-gateway-prod-eu-west-2.grafana.net/otlp
    endpoint: "${env:GRAFANA_CLOUD_OTLP_ENDPOINT}"
    auth:
      authenticator: basicauth/grafana_cloud

service:
  extensions: [basicauth/grafana_cloud]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file, otlphttp/grafana_cloud]
