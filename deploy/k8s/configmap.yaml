apiVersion: v1
kind: ConfigMap
metadata:
  name: presidio-gateway-config
  labels:
    app: presidio-gateway
data:
  PRESIDIO_ANALYZER_URL: "http://presidio-analyzer:3000"
  PRESIDIO_ANONYMIZER_URL: "http://presidio-anonymizer:3000"
  REDACT_ENTITIES: "PERSON,EMAIL_ADDRESS,PHONE_NUMBER,CREDIT_CARD,IP_ADDRESS,US_SSN"
  ANONYMIZE_OPERATOR: "replace"
  SCAN_JSON: "true"
  EXPORT_PROTOCOL: "grpc"
  # Forward to the in-cluster downstream collector Service (which then ships to
  # Grafana Cloud). To export straight to Grafana Cloud instead, point this at
  # your OTLP gateway and set EXPORT_INSECURE "false" + auth via the Secret.
  EXPORT_ENDPOINTS: "downstream-collector:4317"
  EXPORT_INSECURE: "true"
  FAIL_MODE: "reject"
  LOG_LEVEL: "INFO"
