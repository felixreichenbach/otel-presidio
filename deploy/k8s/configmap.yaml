apiVersion: v1
kind: ConfigMap
metadata:
  name: presidio-gateway-config
  labels:
    app: presidio-gateway
data:
  PRESIDIO_ANALYZER_URL: "http://presidio-analyzer:3000"
  PRESIDIO_ANONYMIZER_URL: "http://presidio-anonymizer:3000"
  REDACT_ENTITIES: "PERSON,EMAIL_ADDRESS,PHONE_NUMBER,CREDIT_CARD,IP_ADDRESS,US_SSN"
  ANONYMIZE_OPERATOR: "replace"
  SCAN_JSON: "true"
  EXPORT_PROTOCOL: "grpc"
  # REQUIRED: point the gateway at your OTLP downstream — an in-cluster OTEL
  # Collector / Alloy Service (e.g. "otel-collector:4317"), or a vendor OTLP
  # endpoint (e.g. "https://otlp-gateway-<region>.grafana.net/otlp", with
  # EXPORT_PROTOCOL "http"). The gateway ships redacted logs here over OTLP;
  # no collector is bundled with this deployment.
  EXPORT_ENDPOINTS: "otel-collector:4317"
  # true for plaintext in-cluster hops; set "false" for TLS / external endpoints
  # (and supply auth via the Secret's EXPORT_HEADERS).
  EXPORT_INSECURE: "true"
  FAIL_MODE: "reject"
  LOG_LEVEL: "INFO"
