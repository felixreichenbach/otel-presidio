apiVersion: apps/v1
kind: Deployment
metadata:
  name: presidio-gateway
  labels:
    app: presidio-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: presidio-gateway
  template:
    metadata:
      labels:
        app: presidio-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: gateway
          image: ghcr.io/example/presidio-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          envFrom:
            - configMapRef:
                name: presidio-gateway-config
            - secretRef:
                name: presidio-gateway-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: otlp-http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: otlp-http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
