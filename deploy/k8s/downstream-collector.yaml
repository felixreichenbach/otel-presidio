# Downstream OTLP collector -- receives already-redacted logs from the gateway
# and ships them to Grafana Cloud (also echoing to stdout/file for demos).
# Stands in for the docker-compose `downstream-collector` service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: downstream-collector-config
  labels:
    app: downstream-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    extensions:
      basicauth/grafana_cloud:
        client_auth:
          username: "${env:GRAFANA_CLOUD_INSTANCE_ID}"
          password: "${env:GRAFANA_CLOUD_API_TOKEN}"

    processors:
      batch: {}

    exporters:
      debug:
        verbosity: detailed
      file:
        path: /output/received-logs.json
      otlphttp/grafana_cloud:
        endpoint: "${env:GRAFANA_CLOUD_OTLP_ENDPOINT}"
        auth:
          authenticator: basicauth/grafana_cloud

    service:
      extensions: [basicauth/grafana_cloud]
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, file, otlphttp/grafana_cloud]
# NOTE: the downstream-collector-secrets Secret is generated by the kustomize
# secretGenerator in kustomization.yaml, which reads the gitignored
# grafana-cloud.env (see grafana-cloud.env.example). Credentials are never
# committed to git.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: downstream-collector
  labels:
    app: downstream-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: downstream-collector
  template:
    metadata:
      labels:
        app: downstream-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          envFrom:
            - secretRef:
                name: downstream-collector-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: output
              mountPath: /output
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: downstream-collector-config
        # Ephemeral scratch for the file exporter (demo verification only).
        - name: output
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: downstream-collector
  labels:
    app: downstream-collector
spec:
  type: ClusterIP
  selector:
    app: downstream-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: downstream-collector
  labels:
    app: downstream-collector
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: downstream-collector
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
