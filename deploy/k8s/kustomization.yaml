apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applies the namespace to every resource below.
namespace: loki-presidio

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - gateway.yaml
  - presidio-analyzer.yaml
  - presidio-anonymizer.yaml
  - downstream-collector.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: loki-presidio
    includeSelectors: false
