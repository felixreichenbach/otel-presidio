apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applies the namespace to every resource below.
namespace: otel-presidio

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - gateway.yaml
  - presidio-analyzer.yaml
  - presidio-anonymizer.yaml
  - downstream-collector.yaml

# Grafana Cloud OTLP credentials for the downstream collector, read from the
# gitignored grafana-cloud.env (copy grafana-cloud.env.example to create it).
# Kustomize appends a content hash to the Secret name and rewrites the
# collector's secretRef, so editing the creds triggers an automatic rollout.
secretGenerator:
  - name: downstream-collector-secrets
    envs:
      - grafana-cloud.env

labels:
  - pairs:
      app.kubernetes.io/part-of: otel-presidio
    includeSelectors: false
