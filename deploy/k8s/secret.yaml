# Sensitive values (downstream auth headers) are supplied via a Secret, never
# baked into the image or ConfigMap. Replace the example token before applying.
apiVersion: v1
kind: Secret
metadata:
  name: otel-gateway-secrets
  labels:
    app: otel-gateway
type: Opaque
stringData:
  # Auth headers for the gateway's downstream OTLP export (EXPORT_ENDPOINTS in
  # the ConfigMap). Leave empty for an unauthenticated in-cluster downstream;
  # set when the target needs auth, e.g. exporting straight to Grafana Cloud:
  # "Authorization=Basic <base64 instanceID:token>".
  EXPORT_HEADERS: ""
