# Sensitive values (downstream auth headers) are supplied via a Secret, never
# baked into the image or ConfigMap. Replace the example token before applying.
apiVersion: v1
kind: Secret
metadata:
  name: presidio-gateway-secrets
  labels:
    app: presidio-gateway
type: Opaque
stringData:
  # Auth headers for the gateway's downstream OTLP export. Leave empty when
  # exporting via the in-cluster downstream-collector (the internal gRPC hop
  # needs no auth). Set only when the gateway exports STRAIGHT to Grafana
  # Cloud, e.g. "Authorization=Basic <base64 instanceID:token>".
  EXPORT_HEADERS: ""
