name: otel-presidio

services:
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - "5001:3000"
    environment:
      # gunicorn workers -- the analyzer is CPU-bound (spaCy NER) and defaults
      # to a single worker (~1 core). Each worker loads its own ~750 MiB model,
      # so size to (cores to spend) vs (available RAM). See README "Scaling".
      WORKERS: "6"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:3000/health'); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 20

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    ports:
      - "5002:3000"
    environment:
      # Anonymizer is lightweight (string substitution, no ML model); a small
      # bump is plenty -- it is rarely the bottleneck.
      WORKERS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:3000/health'); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    build: .
    ports:
      - "4317:4317"   # OTLP/gRPC ingest
      - "4318:4318"   # OTLP/HTTP ingest + /healthz /readyz /metrics
    networks:
      - default
      - shared_bridge
    environment:
      EXPORT_PROTOCOL: http
      EXPORT_ENDPOINTS: "http://alloy:4318"
      PRESIDIO_ANALYZER_URL: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_URL: http://presidio-anonymizer:3000
      REDACT_ENTITIES: "PERSON,EMAIL_ADDRESS,PHONE_NUMBER,CREDIT_CARD,IP_ADDRESS,US_SSN"
      ANONYMIZE_OPERATOR: replace
      SCAN_JSON: "true"
      FAIL_MODE: reject
      LOG_LEVEL: INFO
    depends_on:
      presidio-analyzer:
        condition: service_healthy
      presidio-anonymizer:
        condition: service_healthy

networks:
  shared_bridge:
    external: true
    name: shared_bridge
